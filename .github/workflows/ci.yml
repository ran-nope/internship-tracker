name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Check secrets and documentation links
        run: |
          python scripts/check_secrets.py
          python scripts/check_docs.py
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Check backend dependencies
        run: python -m pip check
      - name: Run backend tests with isolated SQLite
        run: python -B -m unittest discover -s tests -v
      - name: Install disposable PostgreSQL test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16
      - name: Test migrations and API against disposable PostgreSQL
        env:
          RUN_POSTGRES_TESTS: '1'
        run: python -B -m unittest discover -s tests -p test_migrations.py -v
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Run ESLint
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build
